[project]
name = "agentprobe"
version = "0.1.0"
description = "Real-Time Mechanistic Interpretability & Neuro-Symbolic Delusion Interceptor for Compound AI Systems"
authors = [{ name = "AgentProbe Contributors" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "z3-solver>=5.0.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "ruff",
    "mypy"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
