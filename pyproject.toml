[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "agentprobe"
version = "0.1.0"
description = "Real-Time Mechanistic Interpretability & Neuro-Symbolic Delusion Interceptor for Compound AI Systems"
authors = ["AI Engineer"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
torch = ">=2.4.0"
transformers = ">=4.44.0"
z3-solver = ">=4.13.0"
pydantic = ">=2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = "*"
ruff = "*"
mypy = "*"

[tool.ruff]
line-length = 165

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
disallow_untyped_defs = true
